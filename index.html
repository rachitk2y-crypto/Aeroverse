/* Layout concept: a flight in three acts. A porthole hero (black cabin wall, blue sky, contrail), a runway-style

}

        { h: 'World War II and the first jets', k: 'Verified', t: 'Radar, long-range bombers and fighters like the Spitfire shaped the war. Hans von Ohain and Frank Whittle developed jet engines independently. The Heinkel He 178 made the first jet-powered flight on 27 August 1939, and the Messerschmitt Me 262 was the first operational jet fighter.' },
        { h: 'Airlines and the jet age', k: 'Verified', t: 'The first scheduled airline flight with a paying passenger was on 1 January 1914 across Tampa Bay. The de Havilland Comet began jet airline service in 1952, and the Boeing 707 followed from 1958. The Boeing 747 flew on 9 February 1969 and entered service in 1970.' },
        { h: 'Modern technology', k: 'Verified', t: 'The Airbus A320 brought digital fly-by-wire to airliners in 1988. Composite structures, GPS navigation, satellite tracking and efficient turbofans define aircraft like the 787 and the A350.' }],
      facts: ['The first Wright flight, about 37 m, was shorter than the wingspan of a Boeing 747-400 (64.4 m).', 'The Concorde and the 747 first flew within a month of each other in 1969.', 'The Comet suffered fatal fatigue failures in 1954, which changed how aircraft are tested.'] },
    { id: 2, t: 'The Biggest Aviation Mysteries', tag: 'What we know, and what we do not.', w: 'evidence', shape: 'airliner2',
      intro: 'Some aviation stories have no final answer. Here every claim is sorted into verified fact, theory or speculation, so that you can see how much each rests on evidence.',
      films: [X('Official investigation material', 'There is no film here I could verify. Official reports are the best source. The ATSB led the underwater search for MH370.', 'https://www.atsb.gov.au/', 'Open ATSB', 'Australian Transport Safety Bureau'),
        X('Research on the Earhart disappearance', 'TIGHAR publishes its research on the Nikumaroro hypothesis. This is one group’s theory and is not accepted as proven.', 'https://tighar.org/', 'Open TIGHAR', 'TIGHAR')],
      beats: [{ h: 'Malaysia Airlines Flight MH370', k: 'Verified', t: 'On 8 March 2014 a Boeing 777-200ER with 239 people on board disappeared from radar after leaving Kuala Lumpur for Beijing. Military radar showed it turning back across Malaysia. Satellite handshakes from Inmarsat showed it kept flying for hours and ended in the southern Indian Ocean. A flaperon found on Réunion in 2015 was confirmed as from MH370. Seabed searches have not found the main wreckage.' },
        { h: 'MH370 theories', k: 'Theory', t: 'Investigators agree the turn-back was likely made with manual or deliberate input. The 2018 Malaysian safety report could not determine why. Theories include deliberate action by someone on board and an in-flight emergency. None has been proven.' },
        { h: 'Amelia Earhart', k: 'Verified', t: 'On 2 July 1937 Earhart and navigator Fred Noonan disappeared near Howland Island in a Lockheed Electra on a flight around the world. The US Coast Guard cutter Itasca heard their last radio calls. No confirmed wreckage has ever been found.' },
        { h: 'What may have happened to Earhart', k: 'Theory', t: 'The most widely held view is that the aircraft ran out of fuel and went down at sea near Howland. A hypothesis says they landed on Nikumaroro and died there. Evidence offered for it is debated and not conclusive.' },
        { h: 'Claims without evidence', k: 'Speculation', t: 'Stories that Earhart was captured, or that aircraft vanish in the Bermuda Triangle through mysterious forces, lack credible evidence. Lloyd’s and the US Coast Guard have found no unusual loss rate there. Flight 19, five Navy bombers lost in 1945, is best explained by navigation errors and fuel exhaustion.' },
        { h: 'Unusual reports in the sky', k: 'Educational', t: 'Most reports of unidentified lights come down to aircraft lights, planets, balloons, satellites or atmospheric effects. A small share remain unexplained because the data is poor, which does not make them extraordinary.' }],
      facts: ['In 1971 the hijacker known as D. B. Cooper parachuted from a Boeing 727 with $200,000. He was never identified, and the FBI closed its active investigation in 2016.', 'After MH370, the required battery life of the underwater locator beacons on flight recorders was extended to 90 days for new aircraft.', 'MH370 also led ICAO to introduce global aircraft tracking requirements.'] },
    { id: 3, t: 'Legendary Aircraft and Their Stories', tag: 'Nine machines that changed the sky.', w: 'legends', shape: 'spy',
      intro: 'Some aircraft are remembered for what they could do, others for what they meant. These nine each left a mark on aviation.',
      films: [V('SR-71_Blackbird_Refueling_in_Flight.webm', 'SR-71 Blackbird refuelling in flight', 'NASA footage of an SR-71 taking on fuel from a tanker.', 'NASA via Wikimedia Commons'), V('NASA_YF-12_Overview.ogv', 'NASA YF-12 overview', 'The YF-12 was the interceptor prototype related to the SR-71. NASA used it for high-speed research.', 'NASA via Wikimedia Commons'),
        V('YF-12A_Landing_at_Edwards_Air_Force_Base.webm', 'YF-12A landing at Edwards', 'A YF-12A touches down at Edwards Air Force Base.', 'NASA via Wikimedia Commons'), V('YF-12C_Approach_and_Landing_at_Edwards_Air_Force_Base.webm', 'YF-12C approach and landing', 'Approach and landing of the YF-12C. The YF-12C was NASA’s designation for an SR-71 airframe.', 'NASA via Wikimedia Commons'),
        V('Space_Shuttle_Enterprise_747_takeoff.ogv', 'Boeing 747 shuttle carrier takeoff', 'A 747 carries Enterprise aloft.', 'NASA via Wikimedia Commons')],
      beats: [{ h: 'Concorde and the 747', k: 'Verified', t: 'Both first flew in 1969. One cut the Atlantic crossing to about three and a half hours for a few. The other carried far more people and changed the economics of flying.' },
        { h: 'SR-71 and U-2', k: 'Verified', t: 'Both were built at Lockheed to see without being stopped. The U-2 flew above 70,000 ft. The SR-71 flew faster than Mach 3 and set the 1976 air-breathing speed record of 3,529.56 km/h.' },
        { h: 'Spitfire', k: 'Verified', t: 'The Spitfire flew in 1936 and stayed in front-line service through 1945 with ever more powerful Merlin and Griffon engines. A total of 20,351 were built.' },
        { h: 'A380, 787, C-130, An-225', k: 'Verified', t: 'The A380 is the largest airliner, with 79.75 m of wingspan. The 787 uses composite structure. The C-130 has been in production since the 1950s. The An-225 was the heaviest aircraft ever built and was destroyed in 2022.' }],
      facts: ['The SR-71 needed special JP-7 fuel and was refuelled soon after takeoff because its panels leaked until heated.', 'The Spitfire’s Merlin engine drove its propeller through a gearbox.', 'Antonov’s An-225 was built for the Buran space shuttle program.'] },
    { id: 4, t: 'Accidents and the Lessons Learned', tag: 'How every accident made flying safer.', w: 'accidents', shape: 'airliner4',
      intro: 'Flying is as safe as it is because investigators examine each accident and the industry acts on what they find. These accounts are factual and avoid graphic detail.',
      films: [X('NTSB investigations', 'The US National Transportation Safety Board publishes reports and animations, including for United 232.', 'https://www.ntsb.gov/', 'Open NTSB', 'NTSB'), X('BEA investigations', 'France’s BEA published the Air France 447 final report in 2012.', 'https://bea.aero/', 'Open BEA', 'BEA'),
        X('AAIB investigations', 'The UK Air Accidents Investigation Branch publishes reports and safety recommendations.', 'https://www.gov.uk/aaib', 'Open AAIB', 'UK AAIB')],
      beats: [{ h: 'How investigators work', k: 'Educational', t: 'Investigators gather wreckage, flight recorders and radar data, and then publish findings and recommendations. Their aim is to prevent repeats, not to assign blame.' },
        { h: 'Safety rules written after accidents', k: 'Verified', t: 'Today’s standard radio phraseology, crew resource management training, ground proximity warnings and mandatory stall and upset recovery training all come from specific accidents.' }],
      facts: ['The de Havilland Comet accidents of 1954 showed metal fatigue could start at window corners. Aircraft windows have been rounded ever since.', 'Aloha Airlines flight 243 in 1988 lost part of its roof in flight and landed safely. It led to the aging aircraft program.', 'Today’s crews train for scenarios that were first understood after accidents.'] },
    { id: 5, t: 'The World’s Fastest Aircraft', tag: 'Mach numbers and the edge of space.', w: 'mach', shape: 'rocket',
      intro: 'Speed records fall into different classes. A rocket plane, an air-breathing jet and an unmanned test vehicle are not directly comparable, so each is kept apart here.',
      films: [V('NASA_YF-12_Overview.ogv', 'NASA YF-12 overview', 'A Mach 3-class aircraft that NASA used for high-speed research.', 'NASA via Wikimedia Commons'), V('SR-71_Blackbird_Refueling_in_Flight.webm', 'SR-71 Blackbird refuelling', 'NASA footage of the SR-71 in flight.', 'NASA via Wikimedia Commons'),
        X('NASA X-15 history', 'NASA’s page on the X-15 research program.', 'https://www.nasa.gov/aeronautics/x-15/', 'Open NASA page', 'NASA'), X('X-15 1959 documentary', 'An article presenting a restored 1959 documentary on the X-15.', 'https://vintageaviationnews.com/warbird-articles/nasas-x-15-original-and-unaltered-1959-documentary.html', 'Open article', 'Vintage Aviation News'),
        X('X-59 quest for quiet supersonic flight', 'A NASA+ video on the X-59.', 'https://plus.nasa.gov/video/x-59-nasas-quest-for-quiet-supersonic-flight/', 'Watch on NASA+', 'NASA')],
      beats: [{ h: 'What a Mach number is', k: 'Educational', t: 'Mach 1 is the speed of sound in the surrounding air. It depends on temperature, so it is about 1,225 km/h at sea level and about 1,062 km/h above 11 km, where the air is colder.' },
        { h: 'Piloted rocket planes', k: 'Verified', t: 'Chuck Yeager flew the Bell X-1 at Mach 1.06 on 14 October 1947. The X-15 reached Mach 6.72 on 3 October 1967 and 107.96 km altitude on 22 August 1963.' },
        { h: 'Piloted jets', k: 'Verified', t: 'The SR-71 holds the record for a piloted air-breathing aircraft: 3,529.56 km/h, set on 28 July 1976. A turbo-ramjet engine let it fly sustained at over Mach 3.' },
        { h: 'Unmanned vehicles', k: 'Verified', t: 'NASA’s X-43A scramjet reached about Mach 9.6 in November 2004, with no pilot and for about ten seconds of powered flight. It is a separate class.' },
        { h: 'Supersonic over land', k: 'Current', t: 'Commercial flight over land at supersonic speed has been restricted in the US since 1973 because of sonic booms. NASA’s X-59 is testing a quieter boom.' }],
      facts: ['Air heats up as speed rises. At Mach 3 the skin of the SR-71 reached several hundred degrees Celsius.', 'The X-15 was dropped from a B-52 at about 45,000 ft.', 'No airliner has flown faster than Concorde, which cruised at about Mach 2.'] },
    { id: 6, t: 'How Pilots Navigate and Land', tag: 'Inside the cockpit.', w: 'cockpit', shape: 'airliner2',
      intro: 'This chapter is educational and is not a replacement for certified pilot training. Real procedures differ by aircraft, airline and country.',
      films: [V('ORD_-_SEA_May_28_Delta_Landing.webm', 'Delta landing in Seattle', 'A landing video on Wikimedia Commons (file name: ORD to SEA, Delta).', 'Wikimedia Commons'), V('Royal_Thai_Air_Force_Airbus_A340-500_touch-and-go_at_Phuket_5Oct2016.webm', 'Airbus A340-500 touch-and-go', 'A touch-and-go at Phuket.', 'Wikimedia Commons'),
        X('Crosswind landing technique', 'An Airbus article on the crosswind landing technique, written for pilots.', 'https://flightsafety.airbus.com/2018/05/25/preventing-runway-excursion-the-crosswind-landing-technique/', 'Read on Airbus', 'Airbus')],
      beats: [{ h: 'Primary flight display', k: 'Educational', t: 'A modern primary flight display combines attitude, airspeed, altitude, vertical speed and heading on one screen. It replaced several separate dials.' },
        { h: 'Flight management and GPS', k: 'Educational', t: 'The flight management system holds the route, calculates fuel and performance, and gives guidance to the autopilot. GPS gives position without ground beacons.' },
        { h: 'VOR and ILS', k: 'Educational', t: 'A VOR is a ground radio beacon that gives bearing from the station. An instrument landing system (ILS) gives lateral guidance from a localizer and vertical guidance from a glideslope, typically 3 degrees.' },
        { h: 'Autopilot and air traffic control', k: 'Educational', t: 'The autopilot flies modes the crew select, and the crew monitors it. Pilots talk to air traffic control in standard phrases so that each message is clear.' },
        { h: 'Crosswind landings', k: 'Educational', t: 'In a crosswind pilots point the nose into the wind to track the runway line, called a crab, and then align with the runway just before touchdown. Some use a wing-low technique.' }],
      facts: ['A Category I ILS approach allows descent to 200 ft above the runway with visibility of at least 550 m.', 'Autoland can land an aircraft in very low visibility with certified systems.', 'A pilot flying an instrument approach cross-checks several instruments continuously.'] },
    { id: 7, t: 'Inside the Aircraft', tag: 'How flying machines work.', w: 'engineering', shape: 'airliner2',
      intro: 'Flight comes down to four forces and a handful of clever systems. Try the diagrams below.',
      films: [V('Demo_of_Active_Resonators_on_the_Active_Noise_Control_Fan_(GRC-2018-CM-0135).webm', 'Active noise control fan demo', 'NASA Glenn research on reducing fan noise.', 'NASA via Wikimedia Commons'), V('%22Miniature_Aces%22_NASA%27s_Dale_Reed_Flight_Research_Laboratory_(AFRC-2015-10946).webm', 'Miniature Aces: Dale Reed laboratory', 'NASA Armstrong’s flight research with small models.', 'NASA via Wikimedia Commons'),
        X('Four forces of flight explainer', 'The Smithsonian National Air and Space Museum explains what a force is and the four forces of flight.', 'https://airandspace.si.edu/multimedia-gallery/four-forces-flight-explainer-demo', 'Open Smithsonian', 'Smithsonian National Air and Space Museum'), X('How Things Fly', 'The Smithsonian’s interactive explanations of flight.', 'https://howthingsfly.si.edu/ask-an-explainer/how-does-airplane-stay-aloft-how-can-something-insubstantial-air-support-all-weight', 'Read on Smithsonian', 'Smithsonian')],
      beats: [{ h: 'How wings generate lift', k: 'Educational', t: 'A wing deflects air downward and creates pressure differences. Both views describe one effect. The wing’s shape and angle of attack decide how much lift it creates.' },
        { h: 'Control surfaces', k: 'Educational', t: 'Ailerons roll the aircraft, elevators pitch it and the rudder yaws it. Flaps and slats change the wing shape for slow flight.' },
        { h: 'Systems', k: 'Educational', t: 'Hydraulics, or in some designs electric actuators, move control surfaces and landing gear. Cabin pressurisation uses engine bleed air or electric compressors to keep the cabin at an altitude of about 8,000 ft or lower.' }],
      facts: ['A modern turbofan moves most of its air around the core, not through it. This bypass air produces much of the thrust and makes it quieter.', 'Landing gear is retracted by hydraulic actuators and held down by locks.', 'Wings are tested to at least 150% of the highest expected load.'] },
    { id: 8, t: 'The Giants of Commercial Aviation', tag: 'Six aircraft that carry the world.', w: 'compare', shape: 'airliner4',
      intro: 'Six airliners define modern long-haul and short-haul travel. Compare their dimensions and range using manufacturer figures.',
      films: [V('AIB_A320neo_F-WNEO_25sep14_LFBO.webm', 'Airbus A320neo flight', 'An A320neo at Toulouse on 25 September 2014, from the file name on Wikimedia Commons.', 'Wikimedia Commons'), V('Royal_Thai_Air_Force_Airbus_A340-500_touch-and-go_at_Phuket_5Oct2016.webm', 'Airbus A340-500 touch-and-go', 'A long-range Airbus four-engine jet at Phuket.', 'Wikimedia Commons')],
      beats: [{ h: 'Four engines to two', k: 'Verified', t: 'Airliners like the A380 and 747 have four engines. The 777, 787 and A350 do the same job with two, because modern engines are more reliable and efficient.' },
        { h: 'Fly-by-wire and composites', k: 'Verified', t: 'The A320 introduced digital fly-by-wire to airliners. The 787 and the A350 use large amounts of carbon-fibre composite to save weight.' },
        { h: 'How airlines use them', k: 'Verified', t: 'Very large aircraft suit busy hub routes. Efficient twin-engine aircraft let airlines fly long routes between smaller cities.' }],
      facts: ['The 747-8 is the longest airliner at 76.3 m.', 'The A380 has the greatest wingspan at 79.75 m.', 'Capacity depends on how an airline arranges the cabin. Figures here are approximate.'] },
    { id: 9, t: 'The Invisible World of Air Traffic Control', tag: 'How thousands of aircraft share the sky.', w: 'radar', shape: 'delta',
      intro: 'Controllers separate aircraft by distance and altitude. The radar below is an original simulation and does not show real traffic.',
      films: [X('Sources on air traffic control', 'I could not verify a film for this chapter. The radar simulation below is the main material.', 'https://www.faa.gov/', 'Open FAA', 'FAA')],
      beats: [{ h: 'Who talks to the pilot', k: 'Educational', t: 'Clearance delivery gives the route. Ground control moves aircraft on taxiways. The tower clears takeoffs and landings. Approach and departure control manage aircraft near the airport, and en-route centres handle the rest of the flight.' },
        { h: 'Separation', k: 'Educational', t: 'Controllers keep aircraft apart horizontally or vertically. Typical minima are about 3 NM close to airports and 5 NM en route with radar, or 1,000 ft vertically, but exact values depend on airspace and equipment.' },
        { h: 'Flight plans and airspace', k: 'Educational', t: 'A flight plan lists the route, altitude and times. Airspace is divided into classes with different rules for equipment and communication.' }],
      facts: ['Radar sends out a pulse and measures the echo. Secondary radar asks the aircraft’s transponder for its code and altitude.', 'Hartsfield–Jackson Atlanta has been ranked among the world’s busiest airports by passengers in most recent years.', 'Pilots read back clearances to catch mistakes.'] },
    { id: 10, t: 'The Future of Aviation', tag: 'What is real, what is being tested, what is only an idea.', w: 'future', shape: 'x59',
      intro: 'Every technology here is labelled by how mature it is. Status changes quickly, so check recent sources.',
      films: [V('FA-18_Automated_Aerial_Refueling.ogv', 'F/A-18 automated aerial refuelling', 'NASA research on automated refuelling, an example of autonomous flight technology.', 'NASA via Wikimedia Commons'),
        X('X-59 quest for quiet supersonic flight', 'A NASA+ video about the X-59.', 'https://plus.nasa.gov/video/x-59-nasas-quest-for-quiet-supersonic-flight/', 'Watch on NASA+', 'NASA'), X('X-59 first flight cockpit video', 'Space.com article with the cockpit video of the X-59’s first flight.', 'https://www.space.com/technology/new-video-takes-you-into-the-cockpit-for-1st-flight-of-nasas-new-x-59-quiet-supersonic-jet', 'Open Space.com', 'Space.com'),
        X('X-57 Maxwell', 'NASA’s all-electric X-plane project.', 'https://science.nasa.gov/3d-resources/x-57-maxwell', 'Open NASA page', 'NASA')],
      beats: [{ h: 'Where the industry is heading', k: 'Educational', t: 'The main goals are lower carbon emissions, less noise and lower cost. No single technology will do all of that, and most gains come from small improvements added together.' }],
      facts: ['Sustainable aviation fuel is approved in blends with conventional jet fuel and already flies on airline services.', 'Battery energy density limits electric aircraft to short routes for now.', 'Hydrogen has high energy per kilogram but needs large tanks.'] }
  ];

  var ACCS = [
    { t: 'Tenerife airport disaster, 1977', s: '27 March 1977, Los Rodeos (Tenerife)', what: 'Two Boeing 747s, a KLM and a Pan Am, collided on a fog-covered runway. 583 people died. It remains the deadliest accident in aviation history.', find: 'The KLM captain began the takeoff roll without a takeoff clearance. The Spanish investigation found the Pan Am aircraft was still on the runway.', cf: 'Many aircraft had been diverted to a small airport because of a bomb incident at Las Palmas. There was dense fog, congested ramps and a runway used as a taxiway.', hf: 'Misunderstood radio phrases, a time-pressured captain and a crew reluctant to challenge him.', tech: 'Radio transmissions overlapped, which blocked a key message. There was no ground radar.', imp: 'Strict phraseology, with the word “takeoff” reserved for the clearance itself. Crew resource management training followed.', les: 'Clear language and shared understanding matter as much as machines.' },
    { t: 'Japan Airlines flight 123, 1985', s: '12 August 1985, Mount Osutaka, Japan', what: 'A Boeing 747SR lost its vertical fin and hydraulics after the rear pressure bulkhead failed. The crew kept flying for about 32 minutes using engine thrust. 520 died and four survived.', find: 'Japan’s accident commission found a faulty repair to the bulkhead after a 1978 tail strike. Fatigue cracks grew until the bulkhead failed.', cf: 'An incomplete repair that was not detected in later inspections.', hf: 'The crew showed outstanding airmanship in handling the damaged aircraft.', tech: 'All four hydraulic systems ran through the damaged tail area.', imp: 'Better repair standards and inspection of structural repairs. Designers reviewed hydraulic routing.', les: 'A single poor repair can stay hidden for years, so records and inspections matter.' },
    { t: 'United Airlines flight 232, 1989', s: '19 July 1989, Sioux City, Iowa', what: 'The tail engine on a McDonnell Douglas DC-10 broke apart in flight and severed all three hydraulic systems. The crew controlled the aircraft using engine thrust and crash-landed at Sioux City. 112 of 296 on board died, and 184 survived.', find: 'The NTSB found a fatigue crack in the engine’s fan disk, which started at a flaw in the titanium alloy that was missed in manufacture and inspection.', cf: 'A manufacturing defect, and inspection methods that did not find the crack.', hf: 'The crew, and a check airman who was a passenger, used crew resource management to cope with a situation no one had trained for.', tech: 'All hydraulic lines ran close together at the tail.', imp: 'Better inspection of titanium engine parts and the introduction of hydraulic shutoff features in new designs.', les: 'Good teamwork can save many lives, but design should not rely on it.' },
    { t: 'Air France flight 447, 2009', s: '1 June 2009, Atlantic Ocean', what: 'An Airbus A330 flying from Rio de Janeiro to Paris crashed into the Atlantic. All 228 on board died. The wreckage and recorders were found two years later.', find: 'France’s BEA found that ice crystals blocked the airspeed probes, the autopilot disconnected, and the crew did not recover from a high-altitude stall.', cf: 'Probe icing at high altitude, unreliable speed readings and a night flight in a weather area.', hf: 'Confusion in the cockpit and a lack of manual handling practice at high altitude.', tech: 'The Thales pitot probes were susceptible to ice.', imp: 'Probes were replaced, and airlines added training for stall and upset recovery, and for unreliable airspeed.', les: 'Automation helps, and pilots must stay ready to fly the aircraft by hand.' },
    { t: 'De Havilland Comet, 1954', s: '10 January and 8 April 1954', what: 'Two Comet airliners broke up in flight within months of each other after the first jet airline service began.', find: 'Investigators tested a fuselage in a water tank and found metal fatigue cracks starting at corners of the windows.', cf: 'Repeated pressurisation cycles and stress at sharp corners.', hf: 'Fatigue was not yet well understood for pressurised jets.', tech: 'Square-cornered windows concentrated stress.', imp: 'Rounded windows, fail-safe structures and fatigue testing became standard.', les: 'Test for what happens after thousands of flights, not only the first.' },
    { t: 'Aloha Airlines flight 243, 1988', s: '28 April 1988, Maui, Hawaii', what: 'A Boeing 737-200 lost a section of its upper cabin roof at 24,000 ft. The pilots landed safely. One flight attendant died.', find: 'The NTSB found widespread fatigue damage along a lap joint in the fuselage skin, after about 89,000 flight cycles on short hops.', cf: 'Corrosion and fatigue in an aircraft with many pressurisation cycles, and maintenance that did not catch the cracks.', hf: 'Inspections missed the damage across several rows of rivets.', tech: 'Multiple small cracks joined together.', imp: 'It led to the aging aircraft program, with inspection and replacement requirements for older aircraft.', les: 'Age is measured in cycles as well as years.' }
  ];

  var FACTS = [
    { q: 'Why do aircraft leave white trails?', a: 'Engine exhaust contains water vapour. At cruise altitude the air is extremely cold, usually below about −40 °C, so the vapour turns into ice crystals. Whether a trail lasts depends on how humid the air is.' },
    { q: 'Why do airplane wings flex?', a: 'In flight the wings carry the whole weight of the aircraft. A wing that bends absorbs gusts and spreads the load. Certification tests bend wings to at least 150% of the highest load expected in service.' },
    { q: 'Why are aircraft windows rounded?', a: 'Sharp corners concentrate stress. The 1954 Comet accidents showed that fatigue cracks can start there. Rounded corners spread the stress.' },
    { q: 'Why do aircraft fly at high altitudes?', a: 'The air is thinner at altitude, so there is less drag and jet engines burn fuel more efficiently. Most airliners cruise between about 31,000 and 42,000 ft, above most weather.' },
    { q: 'How does cabin pressurization work?', a: 'Compressed air from the engines, or electric compressors on some designs, is pumped into the cabin. A valve lets air out to control pressure. The cabin altitude is kept at about 8,000 ft or lower.' },
    { q: 'Why do aircraft have different engine sounds?', a: 'Engines differ in size, in how much air bypasses the core and in fan design. High-bypass turbofans are quieter than older turbojets. At high thrust some fans make a rasping buzz-saw sound.' }
  ];
